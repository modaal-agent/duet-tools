# The toolchain's own gate. The package resolves `duet` by URL at the
# published 0.2.1 tag, so there is ONE checkout — this repo — and SwiftPM
# fetches the framework itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Same two lanes as the duet repo's workflow (see its comment for the full
    # rationale): macos-26 pinned to Xcode 26.6 = the verified GA floor,
    # xcode-27 = the newest line (image default is the pin).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-26
            xcode: "26.6"
          - image: xcode-27
            xcode: ""
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build + test the CLI (sum-coder emission suites)
        id: tests
        run: swift test
      - name: Job summary
        if: always()
        run: |
          {
            echo "### swift · ${{ matrix.image }} — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- toolchain: $(xcodebuild -version | tr '\n' ' ')"
            echo "- swift: $(swift --version 2>&1 | head -1)"
            echo "- lane: ${{ matrix.xcode != '' && 'the GA floor (pinned)' || 'the newest proven line (image default)' }}"
            echo "- builds the \`duet\` CLI (module \`DuetCLI\`) against the resolved \`duet\` 0.2.1 tag; runs the sum-coder emission suites"
          } >> "$GITHUB_STEP_SUMMARY"
