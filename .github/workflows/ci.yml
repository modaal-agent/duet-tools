# The toolchain's own gate (F4 CI templates). Committed while the family is
# still private — first real run at the public flip; until then the same
# commands are the local gate and the Modaal-free receipt runs them from clean
# clones. Pre-publication the package resolves `duet` by SIBLING PATH
# (../modaal-agent-duet), so the job checks both repos out side by side; at
# publication the manifest flips to the URL dependency and the second checkout
# (and its token) retires.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Same two lanes as the duet repo's workflow (see its comment for the full
    # rationale): macos-26 pinned to Xcode 26.6 = the verified GA floor,
    # xcode-27 = the newest line (image default is the pin).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-26
            xcode: "26.6"
          - image: xcode-27
            xcode: ""
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: duet-tools
      - uses: actions/checkout@v4
        with:
          repository: modaal-agent/duet
          path: modaal-agent-duet
          # Private phase only: cross-repo checkout of a private sibling needs a
          # token with contents:read on modaal-agent/duet. Public: delete this.
          token: ${{ secrets.DUET_FAMILY_TOKEN }}
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build + test the CLI (sum-coder emission suites)
        id: tests
        run: cd duet-tools && swift test
      - name: Job summary
        if: always()
        run: |
          {
            echo "### swift · ${{ matrix.image }} — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- toolchain: $(xcodebuild -version | tr '\n' ' ')"
            echo "- swift: $(swift --version 2>&1 | head -1)"
            echo "- lane: ${{ matrix.xcode != '' && 'the GA floor (pinned)' || 'the newest proven line (image default)' }}"
            echo "- builds the \`duet\` CLI (module \`DuetCLI\`) against the sibling \`duet\` checkout; runs the sum-coder emission suites"
          } >> "$GITHUB_STEP_SUMMARY"
